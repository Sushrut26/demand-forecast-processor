# Render Blueprint — one web service running the FastAPI monolith.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: godrej-forecast-platform
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      # --- Set these in the Render dashboard (secrets) ---
      - key: DATABASE_URL          # Supabase / Postgres connection string
        sync: false
      - key: LICENSE_SIGNING_KEY   # from tools/make_signing_key.py (keep secret)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL          # optional: enables persistent file storage
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: forecast-files
      # --- Tunables (safe defaults) ---
      - key: DEFAULT_LICENSE_DAYS
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: MAX_ROWS
        value: "5000"
      - key: MAX_CATEGORY_COLUMNS
        value: "60"
      - key: FORECAST_WORKERS
        value: "1"
